services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PWD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-postgres_db}  # Main database
    ports:
      - "5433:5432"
    volumes:
      - /opt/ppaa-data/postgres:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - ppaa-network
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ppaa.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_DB_PWD:-P@ssw0rd}
    ports:
      - "8099:80"
    volumes:
      - /opt/ppaa-data/pgadmin:/var/lib/pgadmin
    networks:
      - ppaa-network
    depends_on:
      - postgres
    env_file:
      - .env

  # Note: You have MySQL in .env but it's configured as PostgreSQL. 
  # If you need MySQL, keep this garage. If all are PostgreSQL, remove this.
  # mysql:
  #   image: mysql:8.0
  #   container_name: mysql
  #   restart: always
  #   environment:
  #     MYSQL_DATABASE: analytics_db
  #     MYSQL_USER: analytics
  #     MYSQL_PASSWORD: analytics@MNH25
  #     MYSQL_ROOT_PASSWORD: P@ssw0rd
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - /opt/mnh-data/mysql-analytics:/var/lib/mysql
  #   networks:
  #     - mnh-network
  #   env_file:
  #     - .env

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ppaa-network

  backend:
    image: ppaa-internal-portal-backend
    container_name: backend-container
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - ppaa-network
    volumes:
      - ./:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    environment:
      #it will load .env files
      # Email Settings
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-ppaa@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: "True"
      DEFAULT_FROM_EMAIL: ${EMAIL_HOST_USER:-ppaa@gmail.com}

      # Celery + Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  celery_worker:
    image: ppaa-internal-portal-backend
    container_name: celery-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A ppaa_portal.config.celery_app worker --loglevel=info
    volumes:
      - ./:/app
    networks:
      - ppaa-network
    environment:
      # it will pick from .env
      # Email Settings
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-ppaa@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: "True"
      DEFAULT_FROM_EMAIL: ${EMAIL_HOST_USER:-ppaa@gmail.com}

      # Celery + Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "8092:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
    networks:
      - mnh-network
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC (internal, but exposed for demo)
      - "3902:3902"   # S3 Web
      - "3903:3903"   # Admin API
      - "3904:3904"   # K2V API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - /opt/mnh-data/garage/meta:/var/lib/garage/meta
      - /opt/mnh-data/garage/data:/var/lib/garage/data
    networks:
      - mnh-network

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "3909:3909"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      # Use admin_token from garage.toml here
      ADMIN_TOKEN: "61fc9d8784a0605ac0dccdd7ad4a93ae62a400b1ecf64661aad3c4c00a5497ed"
      # Set WebUI login
      AUTH_USER_PASS: "admin:$2y$05$5SwxNjI8u1c3IqyZlhKoZ.jCiOvPifZit1TmNtHsFCtMFdiBxVSs6"
    networks:
      - mnh-network

  mnh_minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    env_file:
      - ./.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /opt/mnh-data/minio:/data
    networks:
      - mnh-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  static_volume:
  media_volume:

networks:
  mnh-network:
    driver: bridge
    external: true