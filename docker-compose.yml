# SPA is served by nginx on host port 8091 → open http://localhost:8091
# (Port 8000 is the Django API, not this container.)
services:
  frontend:
    image: ppaa-portal-frontend
    container_name: frontend-container
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default: AWS Public ECR mirror of Docker Official Images (avoids docker.io when Hub/DNS fails).
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-public.ecr.aws/docker/library/node:18-alpine}
        NGINX_IMAGE: ${DOCKER_NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:alpine}
    # Image already contains /usr/share/nginx/html from build; no bind mount needed to serve.
    ports:
      - "3000:80"
    restart: unless-stopped

networks:
  ppaa-network:
    external: true


