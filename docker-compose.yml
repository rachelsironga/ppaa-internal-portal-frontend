# SPA: map host port (e.g. 8091) in your stack; LAN default http://192.168.1.4:8091 (see backend network_defaults / .env.example)
# (Port 8000 is the Django API, not this container.)
services:
  frontend:
    image: ppaa-portal-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Defaults: Google mirror of Docker Official Images (Dockerfile defaults). Hub often fails on some networks.
        # Override: DOCKER_NODE_IMAGE=public.ecr.aws/docker/library/node:18-alpine
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-mirror.gcr.io/library/node:18-alpine}
        NGINX_IMAGE: ${DOCKER_NGINX_IMAGE:-mirror.gcr.io/library/nginx:alpine}
        # Local dev: localhost. LAN deploy: set VITE_API_URL=http://192.168.1.4:8092 before build.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8092}
    # Image already contains /usr/share/nginx/html from build; no bind mount needed to serve.
    ports:
      - "3000:80"
    restart: unless-stopped

networks:
  ppaa-network:
    external: true


