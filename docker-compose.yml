services:
  frontend:
    image: mnh-connect-frontend
    container_name: frontend-container
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - mnh-network
    ports:
      - "8091:80"
    restart: unless-stopped


networks:
  mnh-network:
    external: true
