# Serves the built React SPA inside the frontend Docker container.
# try_files is required so refresh on /auth/login, /ppaa-internal-portal, etc. works.

server {
    listen 80;
    server_name localhost 127.0.0.1 portal.ppaa.go.tz;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|otf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
