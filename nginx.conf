# Inside the frontend Docker image — serves the built React app only.
# Domain routing (/ → SPA, /api → backend) belongs on the HOST nginx
# (see ../../nginx/portal.ppaa.go.tz.conf). Do not proxy_pass here.

server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
