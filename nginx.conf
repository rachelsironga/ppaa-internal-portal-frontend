server {
    listen 80;
    # Match LAN deployment (see backend ppaa_portal/network_defaults.py); override in custom nginx if needed.
    server_name localhost 127.0.0.1 192.168.1.4;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Optional: cache control
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
