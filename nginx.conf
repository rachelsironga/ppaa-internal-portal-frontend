# Serves the React SPA and proxies API paths to the backend nginx container (service: nginx).
# With host nginx on :80 → this container, one public URL works for both UI and API.

upstream ppaa_api {
    server nginx:80;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 192.168.1.4 portal.ppaa.go.tz;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|user|public|token|admin|swagger|redoc|static|media)(/|$) {
        proxy_pass http://ppaa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/swagger\.(json|yaml)$ {
        proxy_pass http://ppaa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
